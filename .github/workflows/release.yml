name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            asset: linux-amd64
            tags: desktop,production,webkit2_41
            cgo: "1"
            ldflags: "-s -w"
            apt: libgtk-3-dev libwebkit2gtk-4.1-dev
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset: linux-arm64
            tags: desktop,production,webkit2_41
            cgo: "1"
            ldflags: "-s -w"
            apt: libgtk-3-dev libwebkit2gtk-4.1-dev
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-amd64
            ext: ".exe"
            tags: desktop,production
            cgo: "0"
            ldflags: "-s -w -H windowsgui"
          - os: windows-latest
            goos: windows
            goarch: arm64
            asset: windows-arm64
            ext: ".exe"
            tags: desktop,production
            cgo: "0"
            ldflags: "-s -w -H windowsgui"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: darwin-arm64
            tags: desktop,production
            cgo: "1"
            ldflags: "-s -w"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: darwin-amd64
            tags: desktop,production
            cgo: "1"
            ldflags: "-s -w"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ${{ matrix.apt }}

      - name: Build console
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GOOS" = "darwin" ]; then
            # UTType is in UniformTypeIdentifiers on macOS 11 and later.
            export CGO_CFLAGS="${CGO_CFLAGS:+$CGO_CFLAGS }-mmacosx-version-min=10.13"
            export CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-framework UniformTypeIdentifiers -mmacosx-version-min=10.13"
          fi
          out="botnet-${GITHUB_REF_NAME}-${{ matrix.asset }}${{ matrix.ext }}"
          go build -trimpath -tags "${{ matrix.tags }}" -ldflags "${{ matrix.ldflags }}" -o "$out" .
          mkdir -p dist
          mv "$out" "dist/$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Botnet $GITHUB_REF_NAME" \
            --generate-notes
